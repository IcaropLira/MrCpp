name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Generate complete almanac exports
        run: npm run export:almanac
      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended poppler-utils
      - name: Compile complete A4 reference PDF
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory=artifacts artifacts/mrcpp-almanac.tex
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory=artifacts artifacts/mrcpp-almanac.tex
          pdfinfo artifacts/mrcpp-almanac.pdf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mrcpp-almanac-validation
          path: |
            artifacts/mrcpp-almanac.pdf
            artifacts/mrcpp-almanac.tex
            artifacts/mrcpp-almanac.html
            artifacts/content-audit.md
